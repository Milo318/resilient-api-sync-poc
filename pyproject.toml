[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resilient-api-sync-poc"
version = "1.0.0"
description = "An idempotent API synchronization proof with retries and AI-assisted field mapping."
requires-python = ">=3.11"

[project.scripts]
api-sync = "api_sync.cli:main"
api-autonomy-benchmark = "api_sync.autonomous_benchmark:main"

[tool.setuptools.packages.find]
where = ["src"]
